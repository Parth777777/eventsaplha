version: "3.9"

services:
  api:
    build: .
    image: eventalpha:latest
    container_name: eventalpha
    ports:
      - "5000:5000"
    environment:
      # Auth: use local SQLite (set SUPABASE_URL + SUPABASE_JWT_SECRET to swap to Supabase)
      SECRET_KEY: ${SECRET_KEY:-change-me-please-in-prod}
      # Optional integrations — leave blank to disable
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Scheduler cadence
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-3}
      SIGNAL_COOLDOWN_HOURS: ${SIGNAL_COOLDOWN_HOURS:-24}
      SIGNAL_EXPIRY_DAYS: ${SIGNAL_EXPIRY_DAYS:-7}
      APP_VERSION: ${APP_VERSION:-1.0}
    volumes:
      - eventalpha-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  eventalpha-data:
    driver: local
