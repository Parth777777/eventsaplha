<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickwave | Screeners</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link rel="stylesheet" href="./shared/css/style.css">
<script src="./shared/js/theme.js"></script>
<script src="./shared/js/widgets.js"></script>
<style>
.screener-card { background:#0d1118; border:1px solid #1f2336; border-radius:12px; padding:16px; cursor:pointer; transition:all 0.2s; }
.screener-card:hover { border-color:#5b6cff; transform: translateY(-1px); }
.screener-card.active { border-color:#4ee6b8; background:#0e1a16; }
table { border-collapse:collapse; }
th { background:#0d1118; }
tr:hover { background:#0d1118; }
</style>
</head>
<body class="bg-background text-on-surface font-body" style="background:#080c12;color:#dde3ef;">

<aside class="sidebar hidden md:flex">
  <div class="sidebar-header"><h1 class="sidebar-brand">Tickwave</h1><p class="sidebar-brand-sub">Screeners</p></div>
  <nav class="sidebar-nav">
    <a class="sidebar-link" href="index.html"><span class="material-symbols-outlined sidebar-icon">home</span>Home</a>
    <a class="sidebar-link" href="explore.html"><span class="material-symbols-outlined sidebar-icon">explore</span>Explore</a>
    <a class="sidebar-link active" href="screeners.html"><span class="material-symbols-outlined sidebar-icon">filter_alt</span>Screeners</a>
    <a class="sidebar-link" href="watchlist.html"><span class="material-symbols-outlined sidebar-icon">star</span>Watchlist</a>
    <a class="sidebar-link" href="alerts.html"><span class="material-symbols-outlined sidebar-icon">notifications</span>Alerts</a>
    <a class="sidebar-link" href="paper.html"><span class="material-symbols-outlined sidebar-icon">credit_score</span>Paper Trading</a>
    <a class="sidebar-link" href="trust.html"><span class="material-symbols-outlined sidebar-icon">verified</span>Trust</a>
  </nav>
</aside>

<main class="main-content" style="padding:32px;max-width:1300px;">
<header style="margin-bottom:24px;">
  <h1 style="font-family:'Plus Jakarta Sans';font-weight:900;font-size:32px;">SCREENERS</h1>
  <p style="color:#9aa0c8;font-size:13px;">Pre-built filters powered by alpha + forensics + filing-grade data.</p>
</header>

<section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:28px;" id="screenersGrid"></section>

<section id="resultPanel" style="display:none;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
    <h2 id="resultTitle" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px;color:#4ee6b8;"></h2>
    <span id="resultCount" style="font-size:11px;color:#5a5d6a;font-family:monospace;"></span>
    <div style="height:1px;flex:1;background:#1f2336;"></div>
    <button onclick="exportCsv()" style="background:#1f2336;color:#9aa0c8;border:1px solid #2a3142;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;">↓ CSV</button>
  </div>
  <div id="resultTable" style="overflow:auto;border-radius:12px;border:1px solid #1f2336;"></div>
</section>
</main>

<script src="./shared/js/app.js"></script>
<script src="./shared/js/bootstrap.js"></script>
<script>
let _currentResults = [];
let _currentScreener = null;

async function loadScreeners() {
  const r = await fetch('/api/screeners');
  const j = await r.json();
  const grid = document.getElementById('screenersGrid');
  grid.innerHTML = (j.data || []).map(s => `
    <div class="screener-card" data-id="${s.id}" onclick="runScreener('${s.id}', this)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span class="material-symbols-outlined" style="color:#4ee6b8;font-size:18px;">${iconFor(s.id)}</span>
        <span style="font-weight:800;font-size:13px;color:#dde3ef;">${s.name}</span>
      </div>
      <div style="font-size:11px;color:#9aa0c8;line-height:1.5;">${s.description}</div>
    </div>
  `).join('');
}

function iconFor(id) {
  return ({
    high_alpha_clean: 'verified', smallcap_pledge_up: 'trending_up',
    volume_spike_no_news: 'graphic_eq', earnings_within_5d_high_alpha: 'event',
    manipulation_band: 'warning', bulk_deal_targets: 'swap_horiz',
    fo_unusual_24h: 'show_chart', filing_grade: 'shield',
  })[id] || 'filter_alt';
}

async function runScreener(id, el) {
  document.querySelectorAll('.screener-card').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  _currentScreener = id;
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  const tbl = document.getElementById('resultTable');
  tbl.innerHTML = '<div style="padding:30px;text-align:center;color:#5a5d6a;font-size:11px;">Running…</div>';

  const r = await fetch('/api/screeners/' + id);
  const j = await r.json();
  document.getElementById('resultTitle').textContent = j.name || id;
  document.getElementById('resultCount').textContent = (j.count || 0) + ' results';

  const rows = j.data || [];
  _currentResults = rows;
  if (!rows.length) {
    tbl.innerHTML = `<div style="padding:30px;text-align:center;color:#5a5d6a;font-size:11px;">No results. ${j.warning ? '(' + j.warning + ')' : ''}</div>`;
    return;
  }
  const cols = Object.keys(rows[0]);
  tbl.innerHTML = `<table style="width:100%;font-size:12px;color:#dde3ef;">
    <thead><tr>${cols.map(c => `<th style="text-align:left;padding:10px 14px;font-size:10px;color:#9aa0c8;text-transform:uppercase;letter-spacing:0.06em;font-weight:800;border-bottom:1px solid #1f2336;">${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr style="border-bottom:1px solid #1f2336;">${cols.map(c => `<td style="padding:10px 14px;font-family:monospace;">${formatCell(r[c], c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function formatCell(v, col) {
  if (v == null) return '<span style="color:#5a5d6a;">—</span>';
  if (typeof v === 'number') {
    if (col.includes('alpha') || col.includes('score') || col.includes('pct')) return v.toFixed(2);
    return v.toLocaleString();
  }
  if (typeof v === 'string' && v.length > 60) return v.slice(0, 58) + '…';
  return String(v);
}

function exportCsv() {
  if (!_currentResults.length) return;
  const cols = Object.keys(_currentResults[0]);
  const csv = [cols.join(',')].concat(_currentResults.map(r => cols.map(c => JSON.stringify(r[c] ?? '')).join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (_currentScreener || 'screener') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

document.addEventListener('DOMContentLoaded', loadScreeners);
</script>
</body>
</html>
