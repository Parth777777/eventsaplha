<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<script>(function(){try{var t=localStorage.getItem('tw-theme')||'dark';document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<script src="./shared/js/theme-toggle.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickwave | Sign Up</title>
    <link rel="icon" type="image/jpeg" href="./shared/img/logo.jpeg" data-tw-favicon>
    <link rel="apple-touch-icon" href="./shared/img/logo.jpeg">
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: {
                "primary": "#8eb4e0", "primary-container": "#3a6ea8", "secondary": "#2dd4aa", "tertiary": "#f29090",
                "error": "#f26b6b", "background": "#080c12", "surface": "#0d1118",
                "surface-container-lowest": "#060a0f", "surface-container-low": "#0d1118",
                "surface-container": "#111720", "surface-container-high": "#161d28",
                "surface-container-highest": "#1c2435", "surface-bright": "#222c3d",
                "on-surface": "#dde3ef", "on-surface-variant": "#8a94a8",
                "outline": "#3d4a5c", "outline-variant": "#253040",
                "bull": "#2dd4aa", "bear": "#f26b6b", "caution": "#e6b84a", "info": "#6ba3d6"
            }, fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["DM Sans"], "mono": ["Geist Mono"] } } }
        }
    </script>
    <link rel="stylesheet" href="./shared/css/style.css">
    <link rel="stylesheet" href="./shared/css/refined.css">
    <script src="./shared/js/theme.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex items-center justify-center rf-page">
<div class="rf-aurora-bg"></div>
<div class="rf-dot-grid"></div>


<div class="w-full max-w-md mx-auto px-6">
    <div class="text-center mb-8">
        <img class="auth-logo mx-auto mb-2" src="./shared/img/logo.jpeg" alt="TickWave" width="96" height="96" data-tw-logo>
        <p class="text-on-surface-variant text-sm">Create your trading intelligence account</p>
    </div>

    <div class="bg-surface-container-low rounded-xl border border-outline-variant/10 p-8">
        <h2 class="font-headline font-bold text-xl text-on-surface mb-6">Sign Up</h2>

        <div id="errorMsg" class="hidden mb-4 p-3 bg-error/10 border border-error/20 rounded text-error text-sm"></div>
        <div id="successMsg" class="hidden mb-4 p-3 bg-secondary/10 border border-secondary/20 rounded text-secondary text-sm"></div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-on-surface-variant uppercase tracking-widest mb-2">Email</label>
                <input id="email" type="email" required placeholder="you@example.com"
                    class="w-full bg-surface-container border border-outline-variant/20 rounded-lg px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary focus:ring-0 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-black text-on-surface-variant uppercase tracking-widest mb-2">Password</label>
                <input id="password" type="password" required minlength="6" placeholder="Min 6 characters"
                    class="w-full bg-surface-container border border-outline-variant/20 rounded-lg px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary focus:ring-0 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-black text-on-surface-variant uppercase tracking-widest mb-2">Confirm Password</label>
                <input id="confirmPassword" type="password" required minlength="6" placeholder="Repeat password"
                    class="w-full bg-surface-container border border-outline-variant/20 rounded-lg px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary focus:ring-0 focus:outline-none">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-secondary text-[#002e2e] py-3 rounded-lg text-sm font-bold uppercase tracking-wider hover:bg-secondary/80 transition-colors">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-on-surface-variant">Already have an account?
                <a href="login.html" class="text-primary font-bold hover:underline">Login</a>
            </p>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-on-surface-variant/50 hover:text-on-surface-variant">Continue without account</a>
        </div>
    </div>
</div>

<script src="./shared/js/app.js"></script>
<script src="./shared/js/bootstrap.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');
        const errEl = document.getElementById('errorMsg');
        const okEl = document.getElementById('successMsg');

        errEl.classList.add('hidden');
        okEl.classList.add('hidden');

        if (password !== confirm) {
            errEl.textContent = 'Passwords do not match';
            errEl.classList.remove('hidden');
            return;
        }

        btn.textContent = 'Creating account...';
        btn.disabled = true;

        const res = await Auth.signup(email, password);

        if (res?.success) {
            window.location.href = 'index.html';
        } else {
            errEl.textContent = res?.error || 'Signup failed';
            errEl.classList.remove('hidden');
            btn.textContent = 'Create Account';
            btn.disabled = false;
        }
    });
});
</script>
</body>
</html>
