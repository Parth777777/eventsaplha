<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventAlpha | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: {
                "primary": "#8eb4e0", "primary-container": "#3a6ea8", "secondary": "#2dd4aa", "tertiary": "#f29090",
                "error": "#f26b6b", "background": "#080c12", "surface": "#0d1118",
                "surface-container-lowest": "#060a0f", "surface-container-low": "#0d1118",
                "surface-container": "#111720", "surface-container-high": "#161d28",
                "surface-container-highest": "#1c2435", "surface-bright": "#222c3d",
                "on-surface": "#dde3ef", "on-surface-variant": "#8a94a8",
                "outline": "#3d4a5c", "outline-variant": "#253040",
                "bull": "#2dd4aa", "bear": "#f26b6b", "caution": "#e6b84a", "info": "#6ba3d6"
            }, fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["DM Sans"], "mono": ["JetBrains Mono"] } } }
        }
    </script>
    <link rel="stylesheet" href="./shared/css/style.css">
    <script src="./shared/js/theme.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex items-center justify-center">

<div class="w-full max-w-md mx-auto px-6">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-black font-headline text-primary mb-2">EventAlpha</h1>
        <p class="text-on-surface-variant text-sm">Event-driven trading intelligence</p>
    </div>

    <div class="bg-surface-container-low rounded-xl border border-outline-variant/10 p-8">
        <h2 class="font-headline font-bold text-xl text-on-surface mb-6">Login</h2>

        <div id="errorMsg" class="hidden mb-4 p-3 bg-error/10 border border-error/20 rounded text-error text-sm"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-on-surface-variant uppercase tracking-widest mb-2">Email</label>
                <input id="email" type="email" required placeholder="you@example.com"
                    class="w-full bg-surface-container border border-outline-variant/20 rounded-lg px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary focus:ring-0 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-black text-on-surface-variant uppercase tracking-widest mb-2">Password</label>
                <input id="password" type="password" required placeholder="Min 6 characters"
                    class="w-full bg-surface-container border border-outline-variant/20 rounded-lg px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary focus:ring-0 focus:outline-none">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-primary text-[#002e6a] py-3 rounded-lg text-sm font-bold uppercase tracking-wider hover:bg-primary/80 transition-colors">
                Login
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-on-surface-variant">Don't have an account?
                <a href="signup.html" class="text-primary font-bold hover:underline">Sign Up</a>
            </p>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-on-surface-variant/50 hover:text-on-surface-variant">Continue without account</a>
        </div>
    </div>
</div>

<script src="./shared/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        const errEl = document.getElementById('errorMsg');

        btn.textContent = 'Logging in...';
        btn.disabled = true;
        errEl.classList.add('hidden');

        const res = await Auth.login(email, password);

        if (res?.success) {
            window.location.href = 'index.html';
        } else {
            errEl.textContent = res?.error || 'Login failed';
            errEl.classList.remove('hidden');
            btn.textContent = 'Login';
            btn.disabled = false;
        }
    });
});
</script>
</body>
</html>
